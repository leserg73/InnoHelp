    <h1 class="topicheading">Препроцессор Inno Setup: IsDirSet</h1>
    <div class="topicbody">
      <h2 class="heading prototip">Прототип функции</h2>
      <p class="prototip1 notopmarginX null"><b>int</b> IsDirSet(<b>str</b> SetupDirective)</p>
      <h2 class="heading">Описание</h2>
      <p>Возвращает ненулевое значение, если указанная директива секции
        <tt><a href="topic_setupsection.htm">[Setup]</a></tt> установлена ​​в
        <tt>yes</tt>, <tt>true</tt> или <tt>1</tt>.</p>
      <p>Функция объявлена в файле <a href="topic_builtinsiss.htm">ISPPBuiltins.iss</a>.</p>

      <p class="indent"><code><a href="topic_yesno.htm">YesNo</a></code>
      </p>
